<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TokenBar demo</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const W = 1440, H = 900;          // frame size in px; 1 world unit = 1 px at z = 0
const DURATION = 8;               // seconds, loops
const FONT = '-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif';
const S = 2;                      // UI scale (points → px), like a Retina screen

// ---------- assets ----------
function loadImage(src) {
  return new Promise((resolve) => { const i = new Image(); i.onload = () => resolve(i); i.src = src; });
}
const [claudeImg, openaiImg] = await Promise.all([loadImage('assets/claude.png'), loadImage('assets/openai.png')]);

/** Draws `img` tinted with `color` (template rendering, like macOS does for menu bar icons). */
function tinted(img, color) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
const claudeWhite = tinted(claudeImg, '#fff');
const openaiWhite = tinted(openaiImg, '#fff');

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const spring = (x) => { x = clamp(x); return 1 - Math.exp(-7 * x) * Math.cos(10 * x); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;

// ---------- timeline ----------
// Everything visible is a pure function of t, so frames render deterministically.
const MENU_ITEM = { x: 850, y: 24 };           // center of the TokenBar status item
function state(t) {
  const open = spring(seg(t, 1.5, 2.1)) * (1 - ease(seg(t, 7.0, 7.3)));
  const codex = ease(seg(t, 3.3, 3.65));        // 0 = Claude expanded, 1 = Codex expanded
  const refreshing = t >= 5.0 && t < 5.8;
  const bump = ease(seg(t, 5.8, 6.3));
  // cursor keyframes [time, x, y]
  const keys = [
    [0, 1180, 560], [0.8, 1180, 560], [1.4, MENU_ITEM.x + 6, MENU_ITEM.y + 6],
    [2.6, MENU_ITEM.x + 6, MENU_ITEM.y + 6], [3.2, 760, 0], // y filled from layout later
    [4.4, 760, 0], [4.9, 578, 0],
    [6.5, 578, 0], [6.95, MENU_ITEM.x + 6, MENU_ITEM.y + 6], [8, MENU_ITEM.x + 6, MENU_ITEM.y + 6],
  ];
  const clicks = [1.45, 3.3, 5.0, 7.0];
  const press = Math.max(...clicks.map((c) => 1 - clamp(Math.abs(t - c) / 0.12)));
  return {
    t, open, codex, refreshing, bump, keys, press,
    menuHighlight: t >= 1.45 && t < 7.05,
    claudeSession: lerp(0.42, 0.47, bump), claudeWeek: lerp(0.18, 0.19, bump),
    codexSession: lerp(0.12, 0.14, bump), codexWeek: lerp(0.27, 0.28, bump),
    updatedText: refreshing ? 'Updating…' : t < 5 ? 'Updated 4m ago' : 'Updated just now',
    spin: refreshing ? (t - 5.0) * 2 * Math.PI * 1.4 : 0,
  };
}

// ---------- 2D drawing helpers ----------
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const pct = (f) => `${Math.floor(f * 100 + 1e-6)}%`;

// ---------- menu bar texture ----------
const MENU_PAD = 600; // extra bar on both sides, so the tilted intro shows no ends
const menuCanvas = Object.assign(document.createElement('canvas'), { width: W + 2 * MENU_PAD, height: 48 });
const mg = menuCanvas.getContext('2d');
function drawMenuBar(s) {
  mg.setTransform(1, 0, 0, 1, 0, 0);
  mg.clearRect(0, 0, menuCanvas.width, 48);
  mg.fillStyle = 'rgba(20, 22, 30, 0.55)'; mg.fillRect(0, 0, menuCanvas.width, 48);
  mg.translate(MENU_PAD, 0);
  mg.textBaseline = 'middle';
  // left: Apple-ish app menu
  mg.fillStyle = '#fff'; mg.font = `600 26px ${FONT}`; mg.fillText('Finder', 72, 25);
  mg.font = `400 26px ${FONT}`;
  ['File', 'Edit', 'View', 'Go', 'Window'].reduce((x, w) => { mg.fillText(w, x, 25); return x + mg.measureText(w).width + 40; }, 190);
  // TokenBar status item
  const items = [[claudeWhite, pct(s.claudeSession)], [openaiWhite, pct(s.codexSession)]];
  mg.font = `500 24px ${FONT}`;
  let width = 0;
  for (const [, v] of items) width += 28 + 8 + mg.measureText(v).width;
  width += 20;
  let x = MENU_ITEM.x - width / 2;
  if (s.menuHighlight) { mg.fillStyle = 'rgba(255,255,255,0.22)'; rr(mg, x - 14, 5, width + 28, 38, 10); mg.fill(); }
  for (const [img, v] of items) {
    mg.drawImage(img, x, 10, 28, 28); x += 36;
    mg.fillStyle = '#fff'; mg.fillText(v, x, 25); x += mg.measureText(v).width + 20;
  }
  // right: system items
  mg.font = `400 26px ${FONT}`; mg.fillStyle = '#fff';
  const clock = 'Thu Oct 23  2:52 PM';
  mg.fillText(clock, W - 40 - mg.measureText(clock).width, 25);
  // wifi + battery glyphs
  const bx = W - 360;
  mg.strokeStyle = '#fff'; mg.lineWidth = 2.5;
  rr(mg, bx, 15, 40, 20, 5); mg.stroke(); mg.fillRect(bx + 4, 19, 26, 12); mg.fillRect(bx + 42, 21, 3, 8);
  for (let i = 0; i < 3; i++) { mg.beginPath(); mg.arc(bx - 50, 36, 8 + i * 7, -Math.PI * 0.75, -Math.PI * 0.25); mg.stroke(); }
}

// ---------- popover texture ----------
const PW = 360 * S, PH_MAX = 330 * S;
const popCanvas = Object.assign(document.createElement('canvas'), { width: PW, height: PH_MAX });
const pg = popCanvas.getContext('2d');

/** Lays out and draws the popover; returns its height and hit points used by the cursor. */
function drawPopover(s) {
  const g = pg;
  g.clearRect(0, 0, PW, PH_MAX);
  const pad = 16 * S, rowH = 50 * S, inset = pad + 26 * S;
  const expandedH = 112 * S, collapsedH = 8 * S;
  const claudeH = rowH + expandedH * (1 - s.codex) + collapsedH * s.codex;
  const codexH = rowH + expandedH * s.codex + collapsedH * (1 - s.codex);
  const height = 8 * S + claudeH + 4 * S + codexH + 14 * S + 44 * S;

  // panel
  g.save();
  rr(g, 0, 0, PW, height, 14 * S); g.clip();
  const bg = g.createLinearGradient(0, 0, 0, height);
  bg.addColorStop(0, 'rgba(46, 52, 64, 0.94)'); bg.addColorStop(1, 'rgba(34, 38, 48, 0.94)');
  g.fillStyle = bg; g.fillRect(0, 0, PW, height);
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 2; rr(g, 1, 1, PW - 2, height - 2, 14 * S); g.stroke();

  const providers = [
    { name: 'Claude', plan: 'Max', logo: claudeImg, x: s.codex, session: s.claudeSession, week: s.claudeWeek,
      resets: ['Resets at 5:10 PM (in 2h 18m)', 'Resets in 3d 4h (Sun, Oct 26 at 7:00 PM)'] },
    { name: 'Codex', plan: 'Plus', logo: openaiWhite, x: 1 - s.codex, session: s.codexSession, week: s.codexWeek,
      resets: ['Resets at 6:45 PM (in 3h 53m)', 'Resets in 5d 2h (Tue, Oct 28 at 4:52 PM)'] },
  ];
  // provider p is expanded by (1 - p.x)
  let y = 8 * S;
  const hits = {};
  providers.forEach((p, i) => {
    const e = 1 - p.x;
    const h = i === 0 ? claudeH : codexH;
    hits[p.name] = y + 25 * S;
    if (e > 0.02) { g.fillStyle = `rgba(255,255,255,${0.05 * e})`; rr(g, 8 * S, y, PW - 16 * S, h, 6 * S); g.fill(); }
    g.save(); g.beginPath(); g.rect(0, y, PW, h); g.clip();
    // header
    g.textBaseline = 'middle';
    g.drawImage(p.logo, pad, y + 16 * S, 18 * S, 18 * S);
    g.fillStyle = '#fff'; g.font = `600 ${15 * S}px ${FONT}`; g.fillText(p.name, inset, y + 25 * S);
    const nameW = g.measureText(p.name).width;
    g.font = `500 ${11 * S}px ${FONT}`;
    const bw = g.measureText(p.plan).width + 12 * S;
    g.fillStyle = 'rgba(255,255,255,0.12)'; rr(g, inset + nameW + 8 * S, y + 16 * S, bw, 18 * S, 5 * S); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillText(p.plan, inset + nameW + 14 * S, y + 25.5 * S);
    g.font = `400 ${15 * S}px ${FONT}`; g.fillStyle = '#fff'; g.textAlign = 'right';
    g.fillText(pct(p.session), PW - pad - 22 * S, y + 25 * S);
    g.textAlign = 'left';
    // chevron
    g.save(); g.translate(PW - pad - 6 * S, y + 25 * S); g.rotate((Math.PI / 2) * e);
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2.2 * S / 1.4; g.beginPath();
    g.moveTo(-3 * S, -5 * S); g.lineTo(2 * S, 0); g.lineTo(-3 * S, 5 * S); g.stroke(); g.restore();
    // collapsed summary
    if (e < 0.98) {
      g.globalAlpha = Math.pow(1 - e, 3);
      g.font = `400 ${12.5 * S}px ${FONT}`; g.fillStyle = 'rgba(255,255,255,0.55)';
      g.fillText(`Session ${pct(p.session)}  ·  Week ${pct(p.week)}`, inset, y + 44 * S);
      g.globalAlpha = 1;
    }
    // details
    if (e > 0.02) {
      g.globalAlpha = e * e;
      [['Current session', p.session, p.resets[0]], ['Weekly', p.week, p.resets[1]]].forEach(([title, v, reset], k) => {
        const ry = y + rowH + 6 * S + k * 60 * S;
        g.font = `600 ${13 * S}px ${FONT}`; g.fillStyle = '#fff'; g.fillText(title, inset, ry);
        g.textAlign = 'right'; g.font = `500 ${13 * S}px ${FONT}`; g.fillText(pct(v), PW - pad - 6 * S, ry); g.textAlign = 'left';
        const bx = inset, by = ry + 13 * S, bwid = PW - pad - 6 * S - inset;
        g.fillStyle = 'rgba(255,255,255,0.12)'; rr(g, bx, by, bwid, 6 * S, 3 * S); g.fill();
        g.fillStyle = '#0A84FF'; rr(g, bx, by, Math.max(6 * S, bwid * v), 6 * S, 3 * S); g.fill();
        g.font = `400 ${11.5 * S}px ${FONT}`; g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillText(reset, inset, ry + 33 * S);
      });
      g.globalAlpha = 1;
    }
    g.restore();
    y += h + 4 * S;
  });
  // divider + footer
  y += 6 * S;
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(16 * S, y, PW - 32 * S, 1.5);
  const fy = y + 24 * S;
  hits.refresh = fy;
  g.save(); g.translate(pad + 7 * S, fy); g.rotate(s.spin);
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1.6 * S; g.beginPath();
  g.arc(0, 0, 6 * S, -Math.PI * 0.35, Math.PI * 1.45); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath();
  g.moveTo(6 * S * Math.cos(-Math.PI * 0.35) + 3 * S, 6 * S * Math.sin(-Math.PI * 0.35));
  g.lineTo(6 * S * Math.cos(-Math.PI * 0.35) - 3 * S, 6 * S * Math.sin(-Math.PI * 0.35) - 1 * S);
  g.lineTo(6 * S * Math.cos(-Math.PI * 0.35) + 1 * S, 6 * S * Math.sin(-Math.PI * 0.35) - 5 * S);
  g.fill(); g.restore();
  g.textBaseline = 'middle'; g.font = `400 ${13 * S}px ${FONT}`; g.fillStyle = 'rgba(255,255,255,0.55)';
  g.fillText(s.updatedText, pad + 20 * S, fy);
  // gear
  g.save(); g.translate(PW - pad - 6 * S, fy); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5 * S;
  g.beginPath(); g.arc(0, 0, 5 * S, 0, Math.PI * 2); g.stroke();
  for (let k = 0; k < 8; k++) { g.rotate(Math.PI / 4); g.beginPath(); g.moveTo(5 * S, 0); g.lineTo(7.5 * S, 0); g.stroke(); }
  g.beginPath(); g.arc(0, 0, 2 * S, 0, Math.PI * 2); g.stroke(); g.restore();
  return { height, hits };
}

// ---------- cursor texture ----------
const curCanvas = Object.assign(document.createElement('canvas'), { width: 64, height: 64 });
{
  const g = curCanvas.getContext('2d');
  g.translate(8, 6); g.scale(1.9, 1.9);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(5.5, 17); g.lineTo(9, 25); g.lineTo(12.5, 23.5);
  g.lineTo(9, 15.5); g.lineTo(16, 15.5); g.closePath();
  g.fillStyle = '#000'; g.fill(); g.lineWidth = 1.6; g.strokeStyle = '#fff'; g.stroke();
}

// ---------- three.js scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const fov = 30;
const camDist = (H / 2) / Math.tan(THREE.MathUtils.degToRad(fov / 2));
const camera = new THREE.PerspectiveCamera(fov, W / H, 10, 10000);

// wallpaper: animated soft gradient with drifting glows
const wallMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uTime;
    float glow(vec2 p, vec2 c, float r){ return exp(-dot(p-c,p-c)/(r*r)); }
    void main(){
      vec2 p = (vUv - vec2(1. / 3.)) * 3.; // plane is 3x the frame; p covers the frame in 0..1
      vec3 col = mix(vec3(0.03,0.05,0.12), vec3(0.05,0.10,0.24), p.y);
      float a = uTime * 6.2831 / ${DURATION.toFixed(1)};
      col += vec3(0.05,0.35,0.85) * 0.55 * glow(p, vec2(0.25 + 0.05*sin(a), 0.35 + 0.04*cos(a)), 0.32);
      col += vec3(0.20,0.75,0.95) * 0.30 * glow(p, vec2(0.80 + 0.04*cos(a), 0.70 + 0.05*sin(a)), 0.28);
      col += vec3(0.45,0.25,0.85) * 0.18 * glow(p, vec2(0.60, 0.15 + 0.03*sin(a)), 0.30);
      gl_FragColor = vec4(col, 1.);
    }`,
});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(W * 3, H * 3), wallMat);
wall.position.z = -400;
scene.add(wall);

// floating gauge rings in the background, echoing the app icon
const rings = new THREE.Group();
for (let i = 0; i < 3; i++) {
  const geo = new THREE.TorusGeometry(140 + i * 70, 3 + i, 16, 160, Math.PI * 1.45);
  const mat = new THREE.MeshBasicMaterial({ color: [0x2aa8ff, 0x5ad8ff, 0x1a5cff][i], transparent: true, opacity: 0.18 - i * 0.04 });
  const m = new THREE.Mesh(geo, mat); m.rotation.z = Math.PI * 1.27; rings.add(m);
}
rings.position.set(-380, -120, -250);
scene.add(rings);

const ui = new THREE.Group();
scene.add(ui);

function texturePlane(canvas, w, h) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  return { mesh, tex };
}
// screen → world (z = 0 plane): origin at center, y up
const sx = (x) => x - W / 2, sy = (y) => H / 2 - y;

const menu = texturePlane(menuCanvas, W + 2 * MENU_PAD, 48);
menu.mesh.position.set(0, sy(24), 0);
ui.add(menu.mesh);

const POP_X = MENU_ITEM.x - PW / 2 + 40, POP_Y = 60;
const pop = texturePlane(popCanvas, PW, PH_MAX);
const popGroup = new THREE.Group();
ui.add(popGroup);
popGroup.add(pop.mesh);

// soft shadow under the popover
const shCanvas = Object.assign(document.createElement('canvas'), { width: 256, height: 256 });
{
  const g = shCanvas.getContext('2d'); const gr = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.65)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shCanvas), transparent: true, depthWrite: false }));
popGroup.add(shadow);

const cursor = texturePlane(curCanvas, 64, 64);
cursor.mesh.position.z = 30;
ui.add(cursor.mesh);

// ---------- frame ----------
window.renderFrame = (t) => {
  const s = state(t);
  drawMenuBar(s); menu.tex.needsUpdate = true;
  const { height, hits } = drawPopover(s); pop.tex.needsUpdate = true;

  // popover: anchored at its top edge, springs open, floats slightly above the desktop
  const o = clamp(s.open, 0, 1.2);
  popGroup.visible = s.open > 0.01;
  const topY = sy(POP_Y) + (1 - o) * 14;
  pop.mesh.position.set(sx(POP_X + PW / 2), topY - PH_MAX / 2, 20);
  popGroup.scale.setScalar(0.94 + 0.06 * s.open);
  popGroup.position.set(sx(POP_X + PW / 2) * (1 - popGroup.scale.x), topY * (1 - popGroup.scale.y), 0);
  pop.mesh.material.opacity = clamp(s.open * 1.4);
  shadow.scale.set(PW * 1.25, height * 1.35, 1);
  shadow.position.set(sx(POP_X + PW / 2), topY - height / 2 - 26, 5);
  shadow.material.opacity = clamp(s.open) * 0.9;

  // cursor path; rows from the live layout
  const rowY = { claude: POP_Y + hits.Claude, codex: POP_Y + hits.Codex, refresh: POP_Y + hits.refresh };
  const ks = s.keys.map(([kt, x, y], i) => [kt, x, y || [0, 0, 0, 0, rowY.codex, rowY.codex, rowY.refresh, rowY.refresh][i]]);
  let cx = ks[0][1], cy = ks[0][2];
  for (let i = 0; i < ks.length - 1; i++) {
    const [t0, x0, y0] = ks[i], [t1, x1, y1] = ks[i + 1];
    if (t >= t0 && t <= t1) { const e = ease((t - t0) / (t1 - t0)); cx = lerp(x0, x1, e); cy = lerp(y0, y1, e); }
    if (t > t1) { cx = x1; cy = y1; }
  }
  const cs = 1 - 0.15 * s.press;
  cursor.mesh.scale.setScalar(cs);
  cursor.mesh.position.set(sx(cx) + 22 * cs, sy(cy) - 24 * cs, 30);

  // camera: eases in from a tilted 3D view, flat while interacting, tilts back out to loop
  const intro = 1 - ease(seg(t, 0, 1.3)), outro = ease(seg(t, 7.3, 8));
  const k = Math.max(intro, outro);
  camera.position.set(lerp(0, 140, k), lerp(0, -90, k), camDist + lerp(0, 120, k));
  camera.lookAt(lerp(0, 90, k), lerp(0, 60, k), 0);
  ui.rotation.set(lerp(0, -0.07, k), lerp(0, 0.09, k), 0);
  rings.rotation.z = 0.3; // static: a moving background makes every GIF frame differ
  wallMat.uniforms.uTime.value = 0;
  renderer.render(scene, camera);
};
window.DURATION = DURATION;
renderFrame(2.5);
window.ready = true;
</script>
</body>
</html>
