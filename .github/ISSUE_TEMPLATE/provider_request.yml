name: Provider request
description: Ask for support for a new AI tool.
labels: [provider]
body:
  - type: input
    id: name
    attributes:
      label: Provider and plan
      placeholder: Gemini Advanced
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where can usage data come from?
      description: Official API, local files, CLI, … Link documentation if you know it. See docs/providers.md for the format we use.
  - type: textarea
    id: limits
    attributes:
      label: Which limits exist?
      description: Session, daily, weekly, monthly, per model, …
