# The macOS app has no third-party Swift dependencies, so only GitHub Actions and the
# website's npm packages are tracked. Add a "swift" ecosystem entry if a package
# dependency is ever introduced.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
