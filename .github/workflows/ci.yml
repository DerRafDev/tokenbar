name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/lint.sh

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test TokenBarKit
        run: scripts/test.sh
      - name: Build app (Release)
        run: |
          xcodebuild build -quiet \
            -project apps/macos/TokenBar.xcodeproj \
            -scheme TokenBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build

  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|ci|chore|build|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(provider): add Gemini support'"
            exit 1
          fi
